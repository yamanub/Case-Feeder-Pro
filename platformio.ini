; ============================================================
;  Case Feeder Pro - PlatformIO build configuration
;
;  Two firmware images:
;    controller  BigTreeTech SKR Pico V1.0 (RP2040). Runs the motors, beams,
;                jam detection and settings for a case feeder, a bullet
;                feeder, or both.
;    lcd         LCDWiki ES3C28P 2.8" ESP32-S3 touchscreen. Shows the
;                feeders and controls them over a UART link.
;
;  Build and flash:  pio run -e controller -t upload
;                    pio run -e lcd -t upload
;  See docs/BUILD_GUIDE.md.
; ============================================================

[platformio]
default_envs = controller, lcd

[env:controller]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
board            = rpipico
framework        = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed    = 115200
; Upload by copying the UF2 onto the board's RPI-RP2 drive (PlatformIO
; resets the board into its bootloader first). Needs no extra USB driver.
upload_protocol  = mbed
build_src_filter =
    +<controller.cpp>
lib_ignore       = FT6336
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:lcd]
platform        = espressif32@^6.5.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder
lib_ldf_mode    = deep+
build_src_filter =
    +<lcd_terminal.cpp>
lib_deps =
    lvgl/lvgl @ ^8.4.0
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Optional: start with the screen turned 180 degrees
    ; -DSCREEN_FLIPPED=1
    ; LVGL: use src/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    ; TFT_eSPI display configuration (replaces User_Setup.h)
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
